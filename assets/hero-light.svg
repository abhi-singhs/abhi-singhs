<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Abhi Singh — Enterprise Solutions Engineer at GitHub, Pune India">
  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b6fd0"/>
      <stop offset="45%" stop-color="#0aa2c9"/>
      <stop offset="100%" stop-color="#00b3c4"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.3 0; 0.3 0; -0.3 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b7cd6"/>
      <stop offset="100%" stop-color="#00b8cc"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b7cd6"/>
      <stop offset="100%" stop-color="#00b8cc" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="baseBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b7cd6" stop-opacity="0"/>
      <stop offset="18%" stop-color="#0b7cd6" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#00b8cc" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00b8cc" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4facfe" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d5e6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00d5e6" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#5b7fa8" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>

    <clipPath id="card">
      <rect x="0" y="0" width="1200" height="330" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="330" fill="#f7fafd"/>
    <rect width="1200" height="330" fill="url(#grid)"/>

    <circle cx="1010" cy="150" r="290" fill="url(#glowA)">
      <animate attributeName="r" values="290;320;290" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="330" r="240" fill="url(#glowB)">
      <animate attributeName="r" values="240;270;240" dur="11s" repeatCount="indefinite"/>
    </circle>

    <!-- decorative orbit system -->
    <g transform="translate(1006 165)" fill="none" stroke="url(#accent)">
      <circle r="128" stroke-opacity="0.20" stroke-width="1"/>
      <circle r="98" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3 9"/>
      <circle r="66" stroke-opacity="0.36" stroke-width="1"/>
      <circle r="34" stroke-opacity="0.52" stroke-width="1.5"/>

      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
        <circle cx="128" cy="0" r="5" fill="#0b7cd6" stroke="none"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="120" to="-240" dur="13s" repeatCount="indefinite"/>
        <circle cx="98" cy="0" r="3.5" fill="#00b8cc" stroke="none"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="240" to="600" dur="8s" repeatCount="indefinite"/>
        <circle cx="66" cy="0" r="3" fill="#3fb9d8" stroke="none"/>
      </g>

      <circle r="12" fill="url(#accent)" stroke="none" fill-opacity="0.9">
        <animate attributeName="r" values="12;15;12" dur="3.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- content -->
    <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <text x="64" y="104" font-size="14" font-weight="700" letter-spacing="4.5" fill="#64748b">SOLUTIONS ENGINEERING · AUTOMATION · DEVOPS</text>

      <text x="64" y="180" font-size="70" font-weight="800" letter-spacing="-1.5" fill="url(#nameGrad)">Abhi Singh</text>

      <rect x="64" y="200" width="360" height="2" rx="1" fill="url(#rule)"/>

      <text x="64" y="238" font-size="25" font-weight="500" fill="#334155">Enterprise <tspan fill="#0b7cd6" font-weight="700">Solutions Engineer</tspan></text>

      <g font-size="14" font-weight="600">
        <g>
          <rect x="64" y="262" width="126" height="32" rx="16" fill="#ffffff" stroke="#d8e3ee"/>
          <circle cx="84" cy="278" r="3.5" fill="#0b7cd6"/>
          <text x="96" y="283" fill="#51607a">Pune, India</text>
        </g>
        <g>
          <rect x="200" y="262" width="186" height="32" rx="16" fill="#ffffff" stroke="#d8e3ee"/>
          <circle cx="220" cy="278" r="3.5" fill="#00b8cc"/>
          <text x="232" y="283" fill="#51607a">Developer Platforms</text>
        </g>
        <g>
          <rect x="396" y="262" width="212" height="32" rx="16" fill="#ffffff" stroke="#d8e3ee"/>
          <circle cx="416" cy="278" r="3.5" fill="#3fb9d8"/>
          <text x="428" y="283" fill="#51607a">AI-Assisted Engineering</text>
        </g>
      </g>
    </g>

    <rect x="0" y="326" width="1200" height="4" fill="url(#baseBar)"/>
  </g>
</svg>
